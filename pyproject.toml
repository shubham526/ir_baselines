[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ir-baselines"
version = "1.0.0"
description = "Neural re-ranking baselines used in the DREQ (ECIR 2024) and QDER (SIGIR 2025) papers"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENCE" }
authors = [{ name = "Shubham Chatterjee", email = "shubham.chatterjee@mst.edu" }]
keywords = ["information-retrieval", "document-ranking", "reproducibility"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch>=1.13",
    "transformers>=4.20",
    "pytrec-eval",
    "tqdm",
    "numpy",
    "scikit-learn",
]

[project.urls]
Homepage = "https://github.com/shubham526/ir-baselines"
DREQ = "https://github.com/shubham526/ECIR2024-DREQ"
QDER = "https://github.com/shubham526/SIGIR2025-QDER"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
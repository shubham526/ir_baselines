[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ir_baselines"
version = "2.0.0"
description = "Neural re-ranking baselines used in the DREQ (ECIR 2024) and QDER (SIGIR 2025) papers"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENCE" }
authors = [{ name = "Shubham Chatterjee", email = "shubham.chatterjee@mst.edu" }]
keywords = ["information-retrieval", "document-ranking", "reproducibility"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch>=1.13",
    "transformers>=4.20",
    "ir_measures",
    "tqdm",
    "numpy",
    "scikit-learn",
]

[project.optional-dependencies]
test = ["pytest>=7"]
data = ["ir_datasets"]
# Pyserini needs a Java runtime (17+), which most of this package does not.
retrieval = ["pyserini"]

[project.urls]
Homepage = "https://github.com/shubham526/ir_baselines"
DREQ = "https://github.com/shubham526/ECIR2024-DREQ"
QDER = "https://github.com/shubham526/SIGIR2025-QDER"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
# So that `pytest` works from the repository root without an editable install
# or a PYTHONPATH. An installed package still takes precedence, which is the
# point of the src layout.
pythonpath = ["src"]
# -ra reports why anything was skipped or failed; the default hides it.
addopts = "-ra"
markers = [
    "slow: trains a model. Deselect with -m 'not slow'.",
]